services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: onboarding
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_NAME: onboarding
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      - postgres
